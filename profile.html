<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .profile-container {
      width: 350px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }

    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #ddd;
      display: block;
      margin: 0 auto 15px;
    }

    .profile-container h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .info {
      margin: 10px 0;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      font-size: 16px;
    }

    .btn:hover {
      background: #45a049;
    }
  </style>
</head>

<body>

  <div class="profile-container">
    <div class="profile-img"></div>

    <h2>User Profile</h2>

    <div class="info"><strong>Name:</strong> Suraj kumar</div>
    <div class="info"><strong>Email:</strong> suraj1212@gmail.com</div>
    <div class="info"><strong>Phone:</strong> +91 93456 67890</div>
    <div class="info"><strong>Address:</strong> New Delhi,India</div>

    <button class="btn"  >Edit Profile</button>
  </div>

</body>
</html>
